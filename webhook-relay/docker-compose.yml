services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-relay_dev_password}
      POSTGRES_DB: relay
    volumes:
      - relay-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://relay:${POSTGRES_PASSWORD:-relay_dev_password}@db:5432/relay
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      RUN_WORKER: "true"
      CORS_ORIGINS: http://localhost:8080
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  dashboard:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  relay-data:
